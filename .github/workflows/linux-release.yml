# Linux package for every commit on master: a GitHub release named after the short commit hash.
#
# game-build/scripts/make-release-linux.sh does the packaging. Its input, the Windows package with the runtime (fefw_rt.dll + .lib,
# built on Windows with clang-cl), is the upstream release BASE_RELEASE here; everything the player's Linux PC runs is built from
# this commit.
name: Linux release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release-${{ github.sha }}

env:
  BASE_REPO: Goldoire/fefw-recomp
  BASE_RELEASE: v0.1.6

jobs:
  package:
    # the oldest supported runner: the AppImage and the Python wheels then run on older glibc too
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Names
        id: names
        run: |
          short=$(git rev-parse --short=7 HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"

      - name: System packages (Tauri, AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Launcher tests
        working-directory: launcher/src-tauri
        run: cargo test --release

      - name: Package (game-build/scripts/make-release-linux.sh)
        env:
          SHORT: ${{ steps.names.outputs.short }}
          # the launcher follows this repository's releases, which are tagged by commit (update.rs REPO, BUILD_ID)
          FEFW_UPDATE_REPO: ${{ github.repository }}
          FEFW_BUILD_ID: ${{ steps.names.outputs.short }}
        run: |
          # the upstream Windows package stands in for this fork's own make-release.ps1 output (it has the runtime)
          gh release download "$BASE_RELEASE" -R "$BASE_REPO" -p '*-win64.zip' -D work/base
          game-build/scripts/make-release-linux.sh work/base/*-win64.zip --version "$SHORT"

      - name: Release
        env:
          SHORT: ${{ steps.names.outputs.short }}
        run: |
          file="work/release/fefw-recomp-$SHORT-linux-x64.tar.gz"
          notes=$(printf 'Linux package built from %s (%s).\n\nRuntime (fefw_rt.dll) from upstream %s. Extract, run fefw-launcher.AppImage, Set up, Play. See README.txt.' \
            "$GITHUB_SHA" "$(git log -1 --format=%s)" "$BASE_RELEASE")
          if gh release view "$SHORT" >/dev/null 2>&1; then
            gh release upload "$SHORT" "$file" --clobber
          else
            gh release create "$SHORT" "$file" --target "$GITHUB_SHA" --title "$SHORT" --notes "$notes"
          fi
