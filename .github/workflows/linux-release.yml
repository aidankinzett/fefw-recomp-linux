# Linux package of the version in launcher/src-tauri/tauri.conf.json, added to this repository's release v<version>.
#
# game-build/scripts/make-release-linux.sh does the packaging. Its input, the Windows package with the runtime (fefw_rt.dll + .lib,
# built on Windows with clang-cl by game-build/scripts/make-release.ps1), has to be on that release already:
#   gh release create v<version> work/release/fefw-recomp-<version>-win64.zip --title <version> --latest=false
# Everything else the player's Linux PC runs is built from this commit. Run by hand (Actions, or gh workflow run): a push does not
# replace the package of a published version.
name: Linux release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-release

jobs:
  package:
    # the oldest supported runner: the AppImage and the Python wheels then run on older glibc too
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Names
        id: names
        run: |
          version=$(jq -r .version launcher/src-tauri/tauri.conf.json)
          [ -n "$version" ] && [ "$version" != null ]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: System packages (Tauri, AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Launcher tests
        working-directory: launcher/src-tauri
        run: cargo test --release

      - name: Package (game-build/scripts/make-release-linux.sh)
        env:
          VERSION: ${{ steps.names.outputs.version }}
          TAG: ${{ steps.names.outputs.tag }}
          # the launcher follows this repository's releases, which are tagged v<version> (update.rs REPO)
          FEFW_UPDATE_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" -p "fefw-recomp-$VERSION-win64.zip" -D work/base
          game-build/scripts/make-release-linux.sh "work/base/fefw-recomp-$VERSION-win64.zip"

      - name: Release
        env:
          VERSION: ${{ steps.names.outputs.version }}
          TAG: ${{ steps.names.outputs.tag }}
        run: |
          gh release upload "$TAG" "work/release/fefw-recomp-$VERSION-linux-x64.tar.gz" --clobber
          gh release edit "$TAG" --draft=false --latest
